<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>License Server · Admin</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a23;
      --panel-2: #1a232e;
      --border: #243140;
      --text: #e6edf3;
      --muted: #8b9aab;
      --accent: #4f8cff;
      --accent-2: #3b6fd6;
      --green: #2ec27e;
      --amber: #e0a526;
      --red: #e5484d;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 80% -10%, #16202c 0%, var(--bg) 55%);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    a { color: var(--accent); }

    /* ---------- Login ---------- */
    #login {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .login-box { width: 360px; max-width: 100%; padding: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .brand .dot { width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #7b5cff); }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
    .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
    input, select {
      width: 100%; padding: 10px 12px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #fff; border: none; padding: 10px 16px;
      border-radius: 9px; font-weight: 600;
    }
    .btn:hover { background: var(--accent-2); }
    .btn.block { width: 100%; margin-top: 20px; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost:hover { background: var(--panel-2); }
    .btn.sm { padding: 6px 10px; font-size: 12px; font-weight: 500; border-radius: 7px; }
    .err { color: var(--red); font-size: 13px; margin-top: 14px; min-height: 18px; }

    /* ---------- App ---------- */
    #app { display: none; }
    header.top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      background: rgba(19,26,35,.6); backdrop-filter: blur(6px);
      position: sticky; top: 0; z-index: 5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .stat .n { font-size: 26px; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .toolbar .filters { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
    .toolbar input { max-width: 280px; }
    .toolbar select { max-width: 200px; }
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--panel-2); }
    .key { font-family: var(--mono); font-size: 13px; }
    .muted { color: var(--muted); }
    .domains span { display: inline-block; font-family: var(--mono); font-size: 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 1px 2px; }
    .product { display: inline-block; font-size: 12px; font-weight: 600; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.active { color: var(--green); background: rgba(46,194,126,.12); }
    .badge.suspended { color: var(--amber); background: rgba(224,165,38,.12); }
    .badge.revoked { color: var(--red); background: rgba(229,72,77,.12); }
    .badge.expired { color: var(--muted); background: rgba(139,154,171,.12); }

    .row-actions { display: flex; gap: 6px; align-items: center; }
    .copy { background: transparent; border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 2px 7px; font-size: 11px; }
    .copy:hover { color: var(--text); border-color: var(--accent); }
    .empty { text-align: center; color: var(--muted); padding: 40px; }

    /* toast */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 12px 18px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 20; }
    .overlay.show { display: grid; }
    .modal { width: 460px; max-width: 92vw; padding: 24px; }
    .modal h2 { margin: 0 0 6px; font-size: 17px; }
    .keybox { font-family: var(--mono); font-size: 18px; letter-spacing: 1px; text-align: center;
      background: var(--bg); border: 1px dashed var(--accent); border-radius: 10px; padding: 16px; margin: 18px 0; user-select: all; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      table { font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- ===== Login ===== -->
  <section id="login">
    <div class="card login-box">
      <div class="brand">
        <span class="dot"></span>
        <div><h1>License Server</h1><small>Панель управления лицензиями</small></div>
      </div>
      <form id="loginForm">
        <label for="username">Логин</label>
        <input id="username" autocomplete="username" required />
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button class="btn block" type="submit">Войти</button>
        <div class="err" id="loginErr"></div>
      </form>
    </div>
  </section>

  <!-- ===== App ===== -->
  <main id="app">
    <header class="top">
      <div class="brand" style="margin:0">
        <span class="dot"></span>
        <div><h1>License Server</h1><small id="who">admin</small></div>
      </div>
      <div class="row-actions">
        <button class="btn" id="genBtn">+ Сгенерировать ключ</button>
        <button class="btn ghost sm" id="logoutBtn">Выйти</button>
      </div>
    </header>

    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="filters">
          <input id="search" placeholder="Поиск по ключу, e-mail или домену…" />
          <select id="productFilter" aria-label="Фильтр по продукту"></select>
        </div>
        <button class="btn ghost sm" id="refreshBtn">Обновить</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ключ</th><th>Продукт</th><th>Статус</th><th>E-mail</th><th>Домены</th>
              <th>Создана</th><th>Проверок</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ===== Modal: choose product ===== -->
  <div class="overlay" id="genModal">
    <div class="card modal">
      <h2>Новая лицензия</h2>
      <p class="muted">Функции, лимиты и срок берутся из справочника продукта. Почта и домен привяжутся при активации.</p>
      <label for="genProduct">Продукт</label>
      <select id="genProduct"></select>
      <p class="muted" id="genSummary"></p>
      <div class="modal-actions">
        <button class="btn ghost" data-close="genModal">Отмена</button>
        <button class="btn" id="createBtn">Создать</button>
      </div>
    </div>
  </div>

  <!-- ===== Modal: new key ===== -->
  <div class="overlay" id="keyModal">
    <div class="card modal">
      <h2>Лицензия создана</h2>
      <p class="muted" id="newKeySummary"></p>
      <div class="keybox" id="newKey"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="copyKeyBtn">Скопировать</button>
        <button class="btn" data-close="keyModal">Готово</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const TOKEN_KEY = 'ek_admin_token';
    const FILTER_KEY = 'ls_product_filter';
    let licenses = [];
    let products = [];

    const $ = (s) => document.querySelector(s);
    const token = () => localStorage.getItem(TOKEN_KEY);

    // E-mail и домены вводят клиенты при активации — выводим только экранированными.
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token()) headers['Authorization'] = 'Bearer ' + token();
      const res = await fetch(path, { ...opts, headers });
      if (res.status === 401) { logout(); throw new Error('Сессия истекла, войдите снова'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Ошибка запроса');
      return data;
    }

    function fmtDate(ms) {
      if (!ms) return '—';
      return new Date(ms).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function copy(text) {
      try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
      catch { toast('Не удалось скопировать'); }
    }

    const productName = (id) => (products.find(p => p.id === id) || {}).name || id;

    function productSummary(p) {
      const term = p.durationDays ? `${p.durationDays} дн. с активации` : 'бессрочно';
      const domains = `${p.maxDomains} ${p.maxDomains === 1 ? 'домен' : 'доменов'}`;
      const features = Object.keys(p.features || {}).filter(k => p.features[k]).length;
      return `${p.licenseType} · ${term} · ${domains} · функций: ${features} · ключ ${p.keyPrefix}…`;
    }

    // ---------- Auth ----------
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#loginErr').textContent = '';
      try {
        const data = await api('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ username: $('#username').value, password: $('#password').value }),
        });
        localStorage.setItem(TOKEN_KEY, data.token);
        $('#who').textContent = data.username;
        showApp();
      } catch (err) {
        $('#loginErr').textContent = err.message;
      }
    });

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      $('#app').style.display = 'none';
      $('#login').style.display = 'grid';
      $('#password').value = '';
    }
    $('#logoutBtn').addEventListener('click', logout);

    async function showApp() {
      $('#login').style.display = 'none';
      $('#app').style.display = 'block';
      await loadProducts();
      await load();
    }

    // ---------- Data ----------
    async function loadProducts() {
      try {
        products = (await api('/api/admin/products')).products || [];
      } catch (err) { toast(err.message); }

      const saved = localStorage.getItem(FILTER_KEY) || '';
      $('#productFilter').innerHTML = `<option value="">Все продукты</option>` +
        products.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      $('#productFilter').value = products.some(p => p.id === saved) ? saved : '';

      $('#genProduct').innerHTML = products.map(p =>
        `<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.keyPrefix)})</option>`).join('');
    }

    async function load() {
      try {
        const data = await api('/api/admin/licenses');
        licenses = data.licenses || [];
        render();
      } catch (err) { toast(err.message); }
    }
    $('#refreshBtn').addEventListener('click', load);

    function renderStats(list) {
      const by = (s) => list.filter(l => l.status === s).length;
      const stats = [
        ['Всего', list.length],
        ['Активные', by('active')],
        ['Приостановлены', by('suspended')],
        ['Отозваны', by('revoked')],
      ];
      $('#stats').innerHTML = stats.map(([l, n]) =>
        `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
    }

    function render() {
      const product = $('#productFilter').value;
      const byProduct = licenses.filter(l => !product || l.productId === product);
      renderStats(byProduct);

      const q = $('#search').value.trim().toLowerCase();
      const list = byProduct.filter(l => {
        if (!q) return true;
        const hay = [l.licenseKey, l.customerEmail || '', ...(l.boundDomains || []).map(d => d.domain)].join(' ').toLowerCase();
        return hay.includes(q);
      });

      if (!list.length) {
        const msg = licenses.length ? 'Ничего не найдено.' : 'Лицензий пока нет. Нажмите «Сгенерировать ключ».';
        $('#rows').innerHTML = `<tr><td colspan="8" class="empty">${msg}</td></tr>`;
        return;
      }

      $('#rows').innerHTML = list.map(l => {
        const domains = (l.boundDomains || []).length
          ? `<div class="domains">${l.boundDomains.map(d => `<span>${esc(d.domain)}</span>`).join('')}</div>`
          : '<span class="muted">не привязан</span>';
        return `<tr>
          <td><span class="key">${esc(l.licenseKey)}</span>
            <button class="copy" data-copy="${esc(l.licenseKey)}">copy</button></td>
          <td><span class="product">${esc(productName(l.productId))}</span></td>
          <td><span class="badge ${esc(l.status)}">${esc(l.status)}</span></td>
          <td>${l.customerEmail ? esc(l.customerEmail) : '<span class="muted">—</span>'}</td>
          <td>${domains}</td>
          <td class="muted">${fmtDate(l.issuedAt)}</td>
          <td class="muted">${l.validationCount || 0}</td>
          <td>
            <select data-id="${l.id}" class="statusSel">
              <option value="active" ${l.status==='active'?'selected':''}>Активна</option>
              <option value="suspended" ${l.status==='suspended'?'selected':''}>Приостановить</option>
              <option value="revoked" ${l.status==='revoked'?'selected':''}>Отозвать</option>
            </select>
          </td>
        </tr>`;
      }).join('');

      document.querySelectorAll('[data-copy]').forEach(b =>
        b.addEventListener('click', () => copy(b.dataset.copy)));
      document.querySelectorAll('.statusSel').forEach(sel =>
        sel.addEventListener('change', () => changeStatus(sel.dataset.id, sel.value)));
    }
    $('#search').addEventListener('input', render);
    $('#productFilter').addEventListener('change', () => {
      try { localStorage.setItem(FILTER_KEY, $('#productFilter').value); } catch {}
      render();
    });

    async function changeStatus(id, status) {
      try {
        await api(`/api/admin/licenses/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
        toast('Статус обновлён');
        await load();
      } catch (err) { toast(err.message); await load(); }
    }

    // ---------- Generate ----------
    function updateGenSummary() {
      const p = products.find(p => p.id === $('#genProduct').value);
      $('#genSummary').textContent = p ? productSummary(p) : '';
    }
    $('#genProduct').addEventListener('change', updateGenSummary);

    $('#genBtn').addEventListener('click', () => {
      if (!products.length) return toast('Справочник продуктов не загружен');
      // По умолчанию предлагаем продукт, выбранный в фильтре
      const filtered = $('#productFilter').value;
      if (filtered) $('#genProduct').value = filtered;
      updateGenSummary();
      $('#genModal').classList.add('show');
    });

    $('#createBtn').addEventListener('click', async () => {
      const productId = $('#genProduct').value;
      $('#createBtn').disabled = true;
      try {
        const data = await api('/api/admin/licenses', { method: 'POST', body: JSON.stringify({ productId }) });
        const p = products.find(p => p.id === data.license.productId);
        $('#newKey').textContent = data.license.licenseKey;
        $('#newKeySummary').textContent = `${productName(data.license.productId)} · ${p ? productSummary(p) : ''}. ` +
          'Передайте ключ клиенту — почта и домен привяжутся при активации.';
        $('#genModal').classList.remove('show');
        $('#keyModal').classList.add('show');
        await load();
      } catch (err) { toast(err.message); }
      finally { $('#createBtn').disabled = false; }
    });

    $('#copyKeyBtn').addEventListener('click', () => copy($('#newKey').textContent));
    document.querySelectorAll('[data-close]').forEach(b =>
      b.addEventListener('click', () => $('#' + b.dataset.close).classList.remove('show')));
    document.querySelectorAll('.overlay').forEach(o =>
      o.addEventListener('click', (e) => { if (e.target === o) o.classList.remove('show'); }));

    // ---------- Boot ----------
    if (token()) showApp().catch(logout);
  </script>
</body>
</html>
